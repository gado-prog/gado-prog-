<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gado AI Lab</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}button{padding:10px 16px}textarea{width:100%;min-height:90px}pre{background:#111;color:#eee;padding:16px;border-radius:10px;white-space:pre-wrap}</style></head><body><h1>Gado AI Lab 🚀</h1><p>Live portfolio demo: RAG, research agent, support triage and ML inference.</p><textarea id="q">How does AI use retrieval?</textarea><br><button onclick="ask()">Run RAG</button><h3>Result</h3><pre id="out">Ready.</pre><script>async function ask(){const out=document.getElementById('out');out.textContent='Running...';try{const r=await fetch('/rag/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('q').value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}}</script></body></html>
